<title> My First Webside </title>
<h1> Selamat Datang! </h1>
<h2> Silakan masukan nama </h2>

<style>
  body{
    background-image: linear-gradient(rgba(0,0,0,0.8)),url('Lake.jpg');
    background-repeat: no-repeat;
    background-size: 100% 100%;
    justify-content: center;
    text-align: center;
    color: white;
  }
  input {
  width: 250px;
  padding: 12px;
  border: 2px solid gray;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
  transition: 0.3s;
}

input:focus {
  border-color: red;
  box-shadow: 0 0 8px rgba(108, 92, 231, 0.4);
}
  
  button{
    background: red;
    border-radius: 10px;
    color: white;
    padding: 10px 20px;
    border: none;
    transition: all 0.5s;
  }
  
  button:hover{
    background: #B50000;
    box-shadow: 0 0 10px red, #b50000, 0 0 50px red;
  }
</style>

<hr>
<form id="form">
  <input id="nama" type="text" placeholder="Nama Panggilan" required>
  
  <br><br>
  
  <button type="submit">Selesai</button>
</form>
<hr>

<script>
document.getElementById("form").addEventListener("submit", function(e) {
  e.preventDefault();

  const nama = document.getElementById("nama").value;

  // Simpan nama
  localStorage.setItem("namaPengguna", nama);

  // Pergi ke halaman berikutnya
  window.location.href = "Second_page.html";
});
</script>
